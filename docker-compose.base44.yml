# Base44 sandbox/dev environment for FLIXO.
# The app is a plain static site (index.html + style.css + script.js, no build step),
# so it is served straight from the bind-mounted working copy on port 3000.
services:
  web:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - BASE44_PREVIEW_MODE
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/index.html', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
